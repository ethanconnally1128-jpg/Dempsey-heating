<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dempsey Heating And Cooling LLC | Wheelersburg, OH</title>
    <meta name="description" content="Premier HVAC contractor in Wheelersburg, Ohio. Heating, Air Conditioning, and expert climate control." />
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Using CDN for simplicity in this setup, works in production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                primary: '#0284c7', // HVAC Blue (Sky 600)
                dark: '#ffffff',    // White (Main Background)
                card: '#f8fafc',    // Slate-50 (Light Card Background)
                light: '#0f172a',   // Slate-900 (Main Text - Dark)
                muted: '#64748b',   // Slate-500 (Muted Text)
                accent: '#dc2626',  // Heating Red (Red 600)
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4"
  }
}
</script>
</head>
  <body class="bg-brand-dark text-brand-light antialiased">
    <div id="root"></div>

    <!-- 
      NETLIFY FORM DETECTION HELPER
      This hidden form ensures Netlify's build bots find the 'contact' form 
      even though the real one is rendered via JavaScript/React.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="phone" />
      <textarea name="details"></textarea>
    </form>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
